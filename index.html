      { title: "API-Flow — Claude Code スキル", meta: "2026 · 社内利用中",
        desc: "web画面要素の動作とAPI呼び出しを追跡し、MSAサービス間の呼び出しフローをシーケンス図として自動可視化。社内の開発・レビューワークフローに適用し、構造把握の時間を短縮しました。" },
      { title: "Read Tracker — Chrome拡張機能", meta: "Chromeウェブストア公開",
        href: "https://chromewebstore.google.com/detail/read-tracker/jgolehhngmpokfjpegicibkoejikcbch",
        desc: "読了コンテンツを追跡・管理するブラウザ拡張。企画から開発・公開まで単独で担当し、ウェブストアに正式公開・運用中です。" },
      { title: "技術ブログ運営", meta: "parse.tistory.com",
        href: "https://parse.tistory.com/",
        desc: "学習内容とトラブルシューティングの過程を継続的に記録・共有しています。" }
    ]
  }
};

const FONTS = {
  pretendard: "'Helvetica Neue', Helvetica, 'Pretendard Variable', Pretendard, sans-serif",
  noto: "'Helvetica Neue', Helvetica, 'Noto Sans KR', sans-serif",
  spoqa: "'Helvetica Neue', Helvetica, 'Spoqa Han Sans Neo', sans-serif"
};

let state = { lang: "ko", font: "pretendard" };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function render() {
  const t = DATA[state.lang];
  const paper = document.getElementById("paper");
  paper.style.fontFamily = FONTS[state.font];

  const contact = t.contact.map(c => `<a href="${esc(c.href)}" target="_blank" rel="noopener">${esc(c.text)}</a>`).join("");

  // group projects by company (order preserved), pull company meta from career
  const groups = [];
  t.projects.forEach(p => {
    let g = groups.find(g => g.company === p.company);
    if (!g) { g = { company: p.company, items: [] }; groups.push(g); }
    g.items.push(p);
  });
  const experience = groups.map(g => {
    const c = t.career.find(c => c.org === g.company) || {};
    const meta = [c.period, c.place].filter(Boolean).join("  ·  ");
    const items = g.items.map(p => `
      <div class="proj">
        <div class="proj-period">${esc(p.period)}</div>
        <div>
          <div class="proj-title">${esc(p.title)}</div>
          <div class="proj-desc">${esc(p.desc)}</div>
        </div>
      </div>`).join("");
    return `
      <div class="grp">
        <div class="grp-head"><span class="grp-co">${esc(g.company)}</span><span class="grp-meta">${esc(meta)}</span></div>
        ${items}
      </div>`;
  }).join("");

  const education = t.education.map(ed => `
    <div style="margin-bottom:14px;">
      <div class="meta-row"><span>${esc(ed.period)}</span><span>${esc(ed.place)}</span></div>
      <div class="head-row"><span class="ed-degree">${esc(ed.degree)}</span><span class="ed-org">${esc(ed.org)}</span></div>
    </div>`).join("");

  const certifications = t.certifications.map(c => `
    <div style="margin-bottom:11px;">
      <div class="meta-row"><span>${esc(c.year)}</span><span>${esc(c.org)}</span></div>
      <div class="cert-name">${esc(c.name)}</div>
    </div>`).join("");

  const dots = n => `<span class="sk-dots">${Array.from({length:5},(_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}</span>`;
  const skills = t.skills.map(s => `
    <div class="sk-row">
      <div class="sk-cat"><span>${esc(s.category)}</span>${s.level?dots(s.level):""}</div>
      <div class="sk-items">${esc(s.items.join("  ·  "))}</div>
    </div>`).join("");

  const secHead = label => `<div class="rule" style="margin-bottom:7px;"></div>
    <div class="sec-label" style="margin-bottom:13px;">${esc(label)}</div>`;

  paper.innerHTML = `
    <div class="contact-row">${contact}</div>
    <div class="hero">
      <div class="photo"><img src="assets/profile.jpg" alt="${esc(t.name)}"></div>
      <div>
        <div class="name">${esc(t.name)}</div>
        <div class="title">${esc(t.title)}</div>
      </div>
    </div>
    <div class="rule" style="margin:22px 0 7px;"></div>
    <div class="sec-label" style="margin-bottom:15px;">${esc(t.labels.experience)}</div>
    ${experience}
    <div class="cols">
      <div>
        ${secHead(t.labels.education)}${education}
        <div class="rule" style="margin:24px 0 7px;"></div>
        <div class="sec-label" style="margin-bottom:13px;">${esc(t.labels.certifications)}</div>
        ${certifications}
      </div>
      <div>
        ${secHead(t.labels.skills)}${skills}
      </div>
    </div>`;

  // ---- page 2 : about + project impact (PAR) ----
  const d = DETAIL[state.lang];
  const p2 = document.getElementById("paper2");
  p2.style.fontFamily = FONTS[state.font];
  const details = d.projects.map(pr => `
    <div class="pd">
      <div class="pd-head"><span class="pd-title">${esc(pr.title)}</span><span class="pd-meta">${esc(pr.meta)}</span></div>
      <div class="pd-stack">${pr.stack.map(s => `<span>${esc(s)}</span>`).join("")}</div>
      <div class="par">
        <b>${esc(d.parLabels.p)}</b><span>${esc(pr.p)}</span>
        <b>${esc(d.parLabels.a)}</b><span>${esc(pr.a)}</span>
        <b>${esc(d.parLabels.c)}</b><span>${esc(pr.c)}</span>
        <b>${esc(d.parLabels.r)}</b><span>${esc(pr.r)}</span>
      </div>
    </div>`).join("");
  p2.innerHTML = `
    <div class="p2-copy">${esc(d.copy)}</div>
    <div class="rule" style="margin-bottom:7px;"></div>
    <div class="sec-label" style="margin-bottom:13px;">${esc(d.aboutLabel)}</div>
    <div class="about-text">${d.about.map(x => `<p class="about-p">${esc(x).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")}</p>`).join("")}</div>
    <div class="rule" style="margin:26px 0 7px;"></div>
    <div class="sec-label" style="margin-bottom:14px;">${esc(d.strengthsLabel)}</div>
    <div>${d.strengths.map(s => `<div class="str"><b>${esc(s.k)}</b> · ${esc(s.d)}</div>`).join("")}</div>`;

  const p3 = document.getElementById("paper3");
  p3.style.fontFamily = FONTS[state.font];
  const sideItems = (d.side || []).map(s => {
    const title = s.href
      ? `<a href="${esc(s.href)}" target="_blank" rel="noopener">${esc(s.title)}</a>`
      : esc(s.title);
    return `
    <div class="side-item">
      <div class="side-head"><span class="side-title">${title}</span><span class="side-meta">${esc(s.meta)}</span></div>
      <div class="side-desc">${esc(s.desc)}</div>
    </div>`;
  }).join("");
  const sideBlock = (d.side && d.side.length) ? `
    <div class="rule" style="margin:28px 0 7px;"></div>
    <div class="sec-label" style="margin-bottom:14px;">${esc(d.sideLabel)}</div>
    ${sideItems}` : "";
  p3.innerHTML = `
    <div class="rule" style="margin-bottom:7px;"></div>
    <div class="sec-label" style="margin-bottom:16px;">${esc(d.projLabel)}</div>
    ${details}
    ${sideBlock}`;

  document.querySelectorAll("#langSeg button").forEach(b => b.className = b.dataset.lang === state.lang ? "on" : "off");
  document.documentElement.lang = state.lang;
}

document.getElementById("langSeg").addEventListener("click", e => {
  if (e.target.dataset.lang) { state.lang = e.target.dataset.lang; render(); }
});

render();

// ---- carousel ----
const SLIDES = 3;
let slide = 0;
function layoutCarousel() {
  const track = document.getElementById("track");
  const carousel = document.getElementById("carousel");
  const papers = [...track.children];
  const gap = 56, vw = carousel.clientWidth;
  let left = 0;
  for (let i = 0; i < slide; i++) left += papers[i].offsetWidth + gap;
  const w = papers[slide].offsetWidth;
  track.style.transform = `translateX(${Math.round(vw / 2 - (left + w / 2))}px)`;
  papers.forEach((p, i) => { p.style.opacity = i === slide ? "1" : "0.4"; p.style.cursor = i === slide ? "default" : "pointer"; });
  document.querySelectorAll("#dots .dot").forEach((d, i) => d.classList.toggle("active", i === slide));
  document.getElementById("prevBtn").disabled = slide === 0;
  document.getElementById("nextBtn").disabled = slide === SLIDES - 1;
}
function goTo(i) { slide = Math.max(0, Math.min(SLIDES - 1, i)); layoutCarousel(); }
(function initCarousel() {
  const dots = document.getElementById("dots");
  dots.innerHTML = Array.from({ length: SLIDES }, (_, i) => `<button class="dot" data-i="${i}"></button>`).join("");
  dots.addEventListener("click", e => { if (e.target.dataset.i) goTo(+e.target.dataset.i); });
  document.getElementById("prevBtn").addEventListener("click", () => goTo(slide - 1));
  document.getElementById("nextBtn").addEventListener("click", () => goTo(slide + 1));
  document.getElementById("track").addEventListener("click", e => {
    const p = e.target.closest(".paper"); if (!p) return;
    const idx = [...e.currentTarget.children].indexOf(p);
    if (idx !== slide && !e.target.closest("a")) goTo(idx);
  });
  window.addEventListener("keydown", e => { if (e.key === "ArrowLeft") goTo(slide - 1); if (e.key === "ArrowRight") goTo(slide + 1); });
  window.addEventListener("resize", layoutCarousel);
  layoutCarousel();
})();
</script>
</body>
</html>
